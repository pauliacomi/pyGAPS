name: CI

on:
  push:
    branches: [master, develop]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  linting-checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: "3.14"
    - name: Install dependencies
      run: uv sync --frozen --group dev
    - name: Run checks
      run: |
        uv run isort --verbose --check-only --diff src tests
        uv run flake8 src tests

  docs-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install pandoc
      run: sudo apt-get update && sudo apt-get install -y pandoc
    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: "3.14"
    - name: Install dependencies
      run: uv sync --frozen --no-default-groups --group docs
    - name: Build docs
      run: |
        uv run sphinx-build -E -j auto -b doctest docs dist/docs
        uv run sphinx-build -E -j auto -b html docs dist/docs
    - name: Check links
      # External sites are flaky; report broken links without failing CI
      continue-on-error: true
      run: uv run sphinx-build -j auto -b linkcheck docs dist/docs

  unit-tests:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write  # Codecov OIDC upload
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v7
    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install package
      run: uv sync --frozen --no-default-groups --group test
    - name: Run tests
      run: uv run pytest --cov --cov-report=xml --cov-report=term-missing -vv
    - name: Upload coverage
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
      uses: codecov/codecov-action@v7
      with:
        use_oidc: true
        files: coverage.xml
        fail_ci_if_error: false

  lowest-deps:
    # Checks the minimum versions declared in pyproject.toml actually work
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: "3.10"
    - name: Install lowest direct dependencies
      run: |
        uv venv
        uv pip install --resolution lowest-direct -e . --group test
    - name: Run tests
      run: uv run --no-sync pytest

  build-publish:
    runs-on: ubuntu-latest
    needs: [linting-checks, docs-build, unit-tests, lowest-deps]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write  # create the GitHub release

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.3
    - name: Build sdist and wheel
      run: uv build
    - name: Publish 📦 to Test PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.TEST_PYPI_API_TOKEN }}
        repository-url: https://test.pypi.org/legacy/
    - name: Publish 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
    - name: GH 🐱🐙 Release
      uses: softprops/action-gh-release@v3
